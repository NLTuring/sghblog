<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}-SchoolHall博客</title>
    <link rel="stylesheet" href="{% static 'bootstrap5/bootstrap.min.css' %}">
    <script src="{% static 'bootstrap5/popper.min.js' %}"></script>
    <script src="{% static 'bootstrap5/bootstrap.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
<header class="p-3 text-bg-success border-bottom mb-2">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                <img src="{% static 'image/schoolhall.jpg' %}" height="40" width="40">
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li>
                    <a href="/" class="nav-link px-2 text-white" _msttexthash="7636954" _msthash="28">首页</a>
                </li>
                <li>
                    <a href="{% url 'blog:pub_blog' %}" class="nav-link px-2 text-white" _msttexthash="6139731" _msthash="29">发布博客</a>
                </li>

            </ul>
            <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search" action="{% url 'blog:search' %}" method="GET">
                <input type="search" name="q" class="form-control " placeholder="搜索......" aria-label="搜索"
                       _mstplaceholder="99723" _msthash="33" _mstaria-label="74607">
            </form>
            {% if  user.is_authenticated %}
                <div class="dropdown text-end">
                    <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="{% static 'image/schoolhall.jpg' %}" alt="mdo" width="32" height="32" class="rounded-circle">
                    </a>
                    <ul class="dropdown-menu text-small">
                        <li><a class="dropdown-item" href="{% url 'sghauth:logout' %}">退出登录</a></li>
                    </ul>
                </div>
            {% else %}
                <div class="text-end">
                    <a href="{% url 'sghauth:login' %}" type="button" class="btn btn-outline-light me-2"
                       _msttexthash="5298241" _msthash="34">登录
                    </a>
                    <a href="{% url 'sghauth:register' %}" type="button" class="btn btn-dark" _msttexthash="4535791"
                       _msthash="35">注册</a>
                </div>
            {% endif %}

        </div>
    </div>
</header>
<main class="container bg-white p-3 rounded">
    {% block  main %}{% endblock %}
</main>
</body>
</html>
